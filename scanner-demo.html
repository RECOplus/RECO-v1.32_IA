<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RECO+ · Escáner de objetos</title>

<!-- ml5.js: DEBE cargar antes que scanner-core.js -->
<script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="scanner-widget.css" />

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% -10%, #234c30, #0d1810 60%);
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #f2f5f2;
    padding: 32px 16px 60px;
  }
  .contenedor { max-width: 520px; margin: 0 auto; }
  .encabezado { text-align: center; margin-bottom: 24px; }
  .encabezado h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.8rem;
    margin: 0 0 6px;
  }
  .encabezado p {
    color: rgba(242, 245, 242, 0.7);
    font-size: 0.95rem;
    margin: 0;
  }
  .encabezado .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.72rem;
    color: #6cbf3f;
    font-weight: 700;
    margin-bottom: 8px;
    display: block;
  }
  .historial {
    margin-top: 22px;
  }
  .historial h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(242,245,242,0.55);
    margin: 0 0 10px;
  }
  .historial ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .historial li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .historial li span.punto {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c, #6cbf3f);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="contenedor">
  <header class="encabezado">
    <span class="eyebrow">RECO+ · Escáner</span>
    <h1>¿Qué estás reciclando?</h1>
    <p>Apunta la cámara al objeto. Lo identificamos y te decimos en qué categoría va.</p>
  </header>

  <!-- Widget del escáner -->
  <div class="reco-scanner" id="recoScanner" data-estado="inactivo">
    <div class="reco-scanner__stage">
      <video class="reco-scanner__video" id="recoVideo" autoplay playsinline></video>

      <div class="reco-scanner__visor">
        <div class="reco-scanner__visor-marco"></div>
        <div class="reco-scanner__linea-scan"></div>
      </div>

      <div class="reco-scanner__overlay" id="recoOverlay">
        <div class="reco-scanner__spinner" id="recoSpinner"></div>
        <div class="reco-scanner__overlay-texto" id="recoOverlayTexto">
          Toca "Iniciar escáner" para activar la cámara.
        </div>
        <button class="reco-scanner__overlay-boton" id="recoBotonOverlay">Iniciar escáner</button>
      </div>
    </div>

    <div class="reco-scanner__resultado" id="recoResultado" data-visible="false">
      <div class="reco-scanner__resultado-icono" id="recoIcono">♳</div>
      <div class="reco-scanner__resultado-texto">
        <div class="reco-scanner__resultado-material" id="recoMaterialNombre">—</div>
        <div class="reco-scanner__resultado-detalle" id="recoDetalle">Esperando objeto...</div>
      </div>
      <div class="reco-scanner__resultado-confianza" id="recoConfianza">—</div>
    </div>

    <div class="reco-scanner__controles">
      <button class="reco-scanner__btn" id="recoBtnPausar" disabled>Pausar</button>
      <button class="reco-scanner__btn reco-scanner__btn--primario" id="recoBtnDetener" disabled>Detener cámara</button>
    </div>

    <div class="reco-scanner__controles">
      <button class="reco-scanner__btn reco-scanner__btn--ia" id="recoBtnIA" disabled>
        ✨ Escaneo preciso (IA)
      </button>
    </div>
  </div>

  <section class="historial">
    <h2>Detectados en esta sesión</h2>
    <ul id="recoHistorial">
      <li style="opacity:.5">Aún no se ha detectado nada.</li>
    </ul>
  </section>
</div>

<script type="module">
  import { RecoScanner, ESTADOS, mensajeErrorLegible } from './scanner-core.js';

  const videoEl = document.getElementById('recoVideo');
  const contenedor = document.getElementById('recoScanner');
  const overlay = document.getElementById('recoOverlay');
  const overlayTexto = document.getElementById('recoOverlayTexto');
  const spinner = document.getElementById('recoSpinner');
  const botonOverlay = document.getElementById('recoBotonOverlay');
  const btnPausar = document.getElementById('recoBtnPausar');
  const btnDetener = document.getElementById('recoBtnDetener');
  const btnIA = document.getElementById('recoBtnIA');

  const resultadoEl = document.getElementById('recoResultado');
  const iconoEl = document.getElementById('recoIcono');
  const materialNombreEl = document.getElementById('recoMaterialNombre');
  const detalleEl = document.getElementById('recoDetalle');
  const confianzaEl = document.getElementById('recoConfianza');
  const historialEl = document.getElementById('recoHistorial');

  let ultimoMaterialId = null;
  let historialSet = new Set();

  const scanner = new RecoScanner({
    videoEl,
    onEstado: (estado, detalle) => {
      contenedor.setAttribute('data-estado', estado);

      const textos = {
        [ESTADOS.INACTIVO]: 'Toca "Iniciar escáner" para activar la cámara.',
        [ESTADOS.SOLICITANDO_CAMARA]: 'Solicitando acceso a la cámara...',
        [ESTADOS.CARGANDO_MODELO]: 'Cargando el modelo de reconocimiento (puede tardar unos segundos)...',
        [ESTADOS.LISTO]: 'Listo. Apunta al objeto.',
        [ESTADOS.ESCANEANDO]: '',
        [ESTADOS.ERROR]: 'Ocurrió un problema.',
      };

      overlayTexto.textContent = textos[estado] || '';
      spinner.style.display = (estado === ESTADOS.SOLICITANDO_CAMARA || estado === ESTADOS.CARGANDO_MODELO) ? 'block' : 'none';
      botonOverlay.style.display = (estado === ESTADOS.INACTIVO || estado === ESTADOS.ERROR) ? 'inline-block' : 'none';
      botonOverlay.textContent = estado === ESTADOS.ERROR ? 'Reintentar' : 'Iniciar escáner';

      btnPausar.disabled = !(estado === ESTADOS.ESCANEANDO);
      btnDetener.disabled = !(estado === ESTADOS.ESCANEANDO || estado === ESTADOS.LISTO);
      btnPausar.textContent = 'Pausar';

      // El botón de IA solo tiene sentido con la cámara ya activa
      // (listo o escaneando). El sub-estado de la propia llamada IA
      // (capturando/consultando) llega en `detalle`, no en `estado`.
      const camaraActiva = estado === ESTADOS.LISTO || estado === ESTADOS.ESCANEANDO;
      const subEstadoIA = detalle && detalle.subEstadoIA;

      if (subEstadoIA) {
        btnIA.disabled = true;
        btnIA.textContent = subEstadoIA === 'capturando' ? '📸 Capturando...' : '🔎 Consultando IA...';
      } else {
        btnIA.disabled = !camaraActiva;
        btnIA.textContent = '✨ Escaneo preciso (IA)';
      }
    },

    onResultado: (material, prediccionesCrudas, meta) => {
      resultadoEl.setAttribute('data-visible', 'true');
      resultadoEl.style.setProperty('--rs-material-color', material.color);
      iconoEl.textContent = material.icono;
      materialNombreEl.textContent = material.nombre;

      if (meta && meta.fuente === 'gemini') {
        // Resultado de un escaneo preciso puntual (una sola muestra,
        // no hay "votos" de una ventana como en MobileNet).
        const etiquetaConfianza = { alta: 'IA · confianza alta', media: 'IA · confianza media', baja: 'IA · confianza baja' };
        confianzaEl.textContent = etiquetaConfianza[meta.confianza] || 'IA';
        detalleEl.textContent = material.labelOriginal ? `Gemini detectó: ${material.labelOriginal}` : 'Clasificado por IA';
      } else if (material.id === 'sin_confianza') {
        confianzaEl.textContent = 'Sin certeza';
        detalleEl.textContent = 'Acércate más o mejora la iluminación.';
      } else {
        const votos = meta ? `${meta.votos}/${meta.deVentana}` : '';
        confianzaEl.textContent = material.confianzaBaja ? 'Confianza baja' : `Consenso ${votos}`;

        const top1 = prediccionesCrudas[0];
        detalleEl.textContent = material.coincidenciaKeyword
          ? `Detectado como "${material.coincidenciaKeyword}"`
          : `Sin categoría exacta (visto: "${top1.label.split(',')[0]}")`;
      }

      // Historial (evita duplicados consecutivos, y no registra
      // "sin_confianza" como una detección real)
      if (material.id !== ultimoMaterialId && material.id !== 'sin_confianza') {
        ultimoMaterialId = material.id;
        agregarAlHistorial(material);
      }
    },

    onError: (error, contexto) => {
      // Un fallo del escaneo preciso (IA) es puntual: la cámara y el
      // escaneo en vivo con MobileNet siguen funcionando normalmente,
      // así que NO se toca el overlay principal ni el estado global.
      // Se muestra el error en el mismo lugar donde aparecen los
      // resultados, y se restaura solo.
      if (contexto === 'escaneoPreciso') {
        detalleEl.textContent = mensajeErrorLegible(error);
        console.error(`[RecoScanner] Error en "${contexto}":`, error);
        return;
      }

      contenedor.setAttribute('data-estado', ESTADOS.ERROR);
      overlayTexto.textContent = mensajeErrorLegible(error);
      spinner.style.display = 'none';
      botonOverlay.style.display = 'inline-block';
      botonOverlay.textContent = 'Reintentar';
      console.error(`[RecoScanner] Error en "${contexto}":`, error);
    },
  });

  function agregarAlHistorial(material) {
    if (historialSet.has(material.id)) return;
    historialSet.add(material.id);

    if (historialEl.children.length === 1 && historialEl.children[0].style.opacity === '0.5') {
      historialEl.innerHTML = '';
    }
    const li = document.createElement('li');
    li.style.setProperty('--c', material.color);
    li.innerHTML = `<span class="punto"></span> ${material.icono} ${material.nombre}`;
    historialEl.prepend(li);
  }

  botonOverlay.addEventListener('click', () => scanner.iniciar());

  btnPausar.addEventListener('click', () => {
    if (btnPausar.textContent === 'Pausar') {
      scanner.pausar();
      btnPausar.textContent = 'Reanudar';
    } else {
      scanner.reanudar();
      btnPausar.textContent = 'Pausar';
    }
  });

  btnDetener.addEventListener('click', () => scanner.detener());

  btnIA.addEventListener('click', () => scanner.escanearPreciso());

  window.addEventListener('beforeunload', () => scanner.destruir());
</script>

</body>
</html>
